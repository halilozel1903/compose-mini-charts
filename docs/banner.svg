<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-mini-charts: lightweight charts for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1430"/>
      <stop offset="1" stop-color="#1f2a6b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#eceef7"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4353d6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4353d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="phone"><rect width="360" height="460" rx="32"/></clipPath>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="176" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-2">compose-mini-charts</text>
    <text x="82" y="230" fill="#cfd5ff" font-size="27" font-weight="500">Lightweight charts for Jetpack Compose:</text>
    <text x="82" y="266" fill="#cfd5ff" font-size="27" font-weight="500">Canvas only, no dependencies</text>
    <text x="82" y="326" fill="#a9b4ff" font-size="20" font-family="'JetBrains Mono', Menlo, monospace">LineChart(values = revenue, labels = months)</text>
    <g font-size="18" font-weight="600" fill="#e6e9ff">
      <rect x="82" y="360" width="122" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="143" y="385" text-anchor="middle">Sparkline</text>
      <rect x="216" y="360" width="84" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="258" y="385" text-anchor="middle">Line</text>
      <rect x="312" y="360" width="76" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="350" y="385" text-anchor="middle">Bar</text>
      <rect x="400" y="360" width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="448" y="385" text-anchor="middle">Donut</text>
      <rect x="508" y="360" width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="588" y="385" text-anchor="middle">Touch highlight</text>
    </g>
    <g transform="translate(82 428)">
      <circle cx="11" cy="11" r="11" fill="#a9b4ff"/>
      <circle cx="47" cy="11" r="11" fill="#ff97b5"/>
      <circle cx="83" cy="11" r="11" fill="#ffc46b"/>
      <circle cx="119" cy="11" r="11" fill="#6fd8c8"/>
      <text x="146" y="18" fill="#cfd5ff" font-size="18" font-weight="500">Colors from your Material 3 theme, light and dark</text>
    </g>
    <text x="82" y="500" fill="#a9b4ff" font-size="18" font-weight="600" fill-opacity="0.85">Animations · Nice axis ticks · TalkBack summaries · Phone and tablet · minSdk 24</text>

    <g transform="translate(840 50)" filter="url(#shadow)">
      <rect width="360" height="460" rx="32" fill="url(#screen)"/>
      <g clip-path="url(#phone)">
        <rect x="20" y="24" width="320" height="108" rx="22" fill="#4353d6"/>
        <text x="40" y="54" fill="#ffffff" fill-opacity="0.8" font-size="13" font-weight="600">Total balance</text>
        <text x="40" y="82" fill="#ffffff" font-size="24" font-weight="800">$24,830.50</text>
        <path d="M180 112 C196 108 204 96 220 100 C236 104 244 88 260 86 C276 84 284 92 300 76 C308 68 314 66 320 62 L320 124 L180 124 Z" fill="url(#spark)"/>
        <path d="M180 112 C196 108 204 96 220 100 C236 104 244 88 260 86 C276 84 284 92 300 76 C308 68 314 66 320 62" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="320" cy="62" r="4.5" fill="#ffffff"/>

        <rect x="20" y="146" width="320" height="150" rx="22" fill="#ffffff"/>
        <text x="40" y="172" fill="#1b1d26" font-size="14" font-weight="700">Revenue</text>
        <g stroke="#dadce6" stroke-width="1">
          <line x1="40" y1="196" x2="320" y2="196"/>
          <line x1="40" y1="230" x2="320" y2="230"/>
          <line x1="40" y1="264" x2="320" y2="264"/>
        </g>
        <path d="M40 262 C58 254 70 250 86 252 C102 254 112 240 132 236 C150 232 160 226 178 218 C196 210 210 190 226 190 C244 190 252 204 270 206 C288 208 302 196 320 194 L320 280 L40 280 Z" fill="url(#area)"/>
        <path d="M40 262 C58 254 70 250 86 252 C102 254 112 240 132 236 C150 232 160 226 178 218 C196 210 210 190 226 190 C244 190 252 204 270 206 C288 208 302 196 320 194" fill="none" stroke="#4353d6" stroke-width="3" stroke-linecap="round"/>
        <line x1="226" y1="190" x2="226" y2="280" stroke="#5b6070" stroke-width="1"/>
        <circle cx="226" cy="190" r="6" fill="#4353d6"/>
        <circle cx="226" cy="190" r="3" fill="#ffffff"/>
        <rect x="240" y="166" width="70" height="44" rx="8" fill="#22252f"/>
        <text x="252" y="184" fill="#f1f2f8" font-size="11" font-weight="700">Jul</text>
        <text x="252" y="201" fill="#f1f2f8" font-size="12">$9.8k</text>

        <rect x="20" y="310" width="154" height="130" rx="22" fill="#ffffff"/>
        <g fill="#4353d6">
          <rect x="36" y="378" width="12" height="46" rx="4" fill-opacity="0.45"/>
          <rect x="55" y="360" width="12" height="64" rx="4" fill-opacity="0.45"/>
          <rect x="74" y="368" width="12" height="56" rx="4" fill-opacity="0.45"/>
          <rect x="93" y="352" width="12" height="72" rx="4" fill-opacity="0.45"/>
          <rect x="112" y="382" width="12" height="42" rx="4" fill-opacity="0.45"/>
          <rect x="131" y="332" width="12" height="92" rx="4"/>
          <rect x="150" y="392" width="12" height="32" rx="4" fill-opacity="0.45"/>
        </g>
        <text x="36" y="334" fill="#1b1d26" font-size="13" font-weight="700">Steps</text>

        <rect x="186" y="310" width="154" height="130" rx="22" fill="#ffffff"/>
        <g transform="translate(263 375)" fill="none" stroke-width="16">
          <circle r="40" stroke="#4353d6" stroke-dasharray="117 135" transform="rotate(-88)"/>
          <circle r="40" stroke="#d9466f" stroke-dasharray="49 203" transform="rotate(81)"/>
          <circle r="40" stroke="#e08a00" stroke-dasharray="24 228" transform="rotate(154)"/>
          <circle r="40" stroke="#00897b" stroke-dasharray="29 223" transform="rotate(191)"/>
          <circle r="40" stroke="#5a6380" stroke-dasharray="16 236" transform="rotate(234)"/>
        </g>
        <text x="263" y="380" fill="#1b1d26" font-size="14" font-weight="800" text-anchor="middle">$2.5k</text>
      </g>
    </g>
  </g>
</svg>
